dataset:
  data_dir: ./data
  name: MNIST
  test_split: 0.1
  val_split: 0.1
experiment:
  base_seed: 42
  device: cpu
  n_runs: 1
  num_workers: 4
  results_dir: ./results
  save_models: true
model:
  conv_channels:
  - 32
  - 64
  fc_hidden: 128
  type: MLP
  use_batchnorm: true
optimizers:
  bayesian:
    enabled: false
  pso:
    enabled: false
  random_search:
    enabled: true
    n_iterations: 5
retraining:
  early_stopping_patience: 20
  max_epochs: 100
search_space:
  batch_size:
    max: 256
    min: 32
    scale: log
    type: int
  dropout:
    max: 0.5
    min: 0.1
    scale: linear
    type: float
  hidden_size:
    max: 512
    min: 64
    scale: linear
    type: int
  learning_rate:
    max: 0.01
    min: 0.0001
    scale: log
    type: float
  num_layers:
    max: 3
    min: 1
    scale: linear
    type: int
  weight_decay:
    max: 0.001
    min: 1.0e-05
    scale: log
    type: float
training:
  early_stopping_patience: 10
  max_epochs: 5
  optimizer_type: adam
